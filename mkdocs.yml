site_name: "RdfCrate"
docs_dir: .

theme:
  name: "material"

plugins:
- search
- same-dir
- mkquartodocs:
    # README.qmd is rendered separately as gfm, and mkquartodocs would overwrite README.md.
    # site/ is the build output, which mkquartodocs doesn't know to skip.
    ignore_pattern: '.*/(README\.qmd|site/.*)'
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          show_source: false
          show_root_heading: true
          heading_level: 2
          show_signature_annotations: true
          allow_inspection: true
- api-autonav:
    modules: 
      - 'src/rdfcrate'
    exclude:
      # Private and WIP modules
      - 'rdfcrate.types'
      - 're:proto'
      - 're:test'
      # Submodules that are already documented in the top level module
      # If we don't exclude these, they will be documented twice,
      # the user might think they need to import directly from these submodules
      - 'rdfcrate.context_graph'
      - 'rdfcrate.vocabs'
      - 'rdfcrate.spec_version'
    module_options:
      # Documented only so that docstrings are included in the API reference
      'rdfcrate\.wrapper$':
        members:
          - RoCrate

nav:
  - 'README.md'
  - 'docs/changelog.md'
  - 'docs/motivation.md'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
